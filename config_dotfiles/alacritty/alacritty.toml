[colors.cursor]
cursor = "0xffffff"

[colors.primary]
background = "#0f0f0f"

[cursor.style]
blinking = "On"

[font]
size = 22

[font.normal]
# family = "JetBrainsMono Nerd Font Mono"
# style = "Regular"
family = "Iosevka Nerd Font Mono"

[window]
option_as_alt = "OnlyLeft"
# opacity = 0.85

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = ","
mods = "Control"
chars = "\u001b[44;5u"

[[keyboard.bindings]]
key = "l"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "P"
mods = "Command"
chars = "\u001bp"

[[keyboard.bindings]]
key = "N"
mods = "Command"
chars = "\u001bn"
