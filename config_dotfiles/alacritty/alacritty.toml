[colors.cursor]
cursor = "0xffffff"

[colors.primary]
background = "#0f0f0f"

[cursor.style]
blinking = "On"

[font]
size = 18

[font.normal]
family = "JetBrainsMono Nerd Font Mono"

[window]
option_as_alt = "OnlyLeft"
# opacity = 0.85

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = ","
mods = "Control"
chars = "\u001b[44;5u"

